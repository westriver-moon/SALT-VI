[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salt-pact-plugin"
version = "0.1.0"
description = "Pose-grounded anatomical counterfactual token learning plugin for SALT-VI"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.1",
  "PyYAML>=6",
  "salt-person-preprocessing>=0.1,<0.2",
]

[project.optional-dependencies]
train = ["torch"]
test = ["pytest>=7"]

[project.scripts]
salt-pact-assets = "pact.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pact*"]
