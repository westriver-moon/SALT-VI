[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salt-qwen-imagination-plugins"
version = "0.1.0"
description = "Centralized versioned Qwen imagination plugins for SALT-VI"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
regional = [
  "opencv-python-headless==4.10.0.84",
  "timm==0.9.16",
  "ultralytics==8.3.179",
]

[project.scripts]
salt-qwen-imagination = "qwen_imagination.regional.cli:main"
salt-qwen-text-annotation = "qwen_imagination.text_annotation.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qwen_imagination*"]
