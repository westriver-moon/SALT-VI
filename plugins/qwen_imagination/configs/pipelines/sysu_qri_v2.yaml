schema_version: 2
dataset: sysu
stage: stage_a
base_variant: c3_b96
base_config: configs/stage_a/safe_tricks/c3_b96_camera_diverse_cosine.yaml
base_final_epoch: 23
environment:
  data_root: SALT_QRI_V2_DATA_ROOT
  view_manifest: SALT_QRI_V2_VIEW_MANIFEST
  experiment_root: SALT_QRI_V2_EXPERIMENT_ROOT
generation:
  plugin: qwen-regional-imagination-v2
  config: configs/qri_v2_imaginative_sysu.yaml
  smoke_source_count: 32
  pilot_source_count: 512
  modalities: [rgb, ir]
  region_selection: top-3-by-normalized-U_swin-no-hard-gate
  proposal_policy: imagination-first-three-rounds
  sampling_policy: candidate-coverage-then-free-joint-sampling
  qwen_samples: 16
  max_worlds: 5
  pasd_geometry: direct_rewrite
  failure_policy: one-SwinIR-world-weight-1
variants:
  uniform:
    config: configs/stage_a/qri-v2/c3_b96_qri_v2_uniform.yaml
    manifest: manifests/manifest.uniform.jsonl
  proposal:
    config: configs/stage_a/qri-v2/c3_b96_qri_v2_proposal.yaml
    manifest: manifests/manifest.proposal.jsonl
  posterior:
    config: configs/stage_a/qri-v2/c3_b96_qri_v2_posterior.yaml
    manifest: manifests/manifest.posterior.jsonl
evaluation:
  protocol: SYSU all-search single-shot 10 gallery trials
  mode: probability-weighted-feature-marginalization
  top_k: 5
  selection_epoch: 23
promotion:
  automatic: false
  rule: report fixed final epoch 23; never select or promote on benchmark test metrics
