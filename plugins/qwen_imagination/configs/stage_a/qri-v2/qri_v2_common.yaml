extends: ${SALT_VI_ROOT}/configs/stage_a/safe_tricks/c3_b96_camera_diverse_cosine.yaml

# QRI-v2 is isolated from QRI-v1 by config path, environment names, IDs and output roots.
sysu_sr_backend: pasd_multiview
sysu_sr_data_root: ${SALT_QRI_V2_DATA_ROOT}
sysu_sr_modalities: [rgb, ir]
sysu_sr_exact_size: true
sysu_sr_view_manifest: ${SALT_QRI_V2_VIEW_MANIFEST}
sysu_sr_views_per_image: 0
sysu_sr_view_sampling: paired
sysu_sr_eval_view_index: 0
sysu_sr_eval_mode: marginalize
sysu_sr_eval_top_k: 5
total_train_epoch: 24
eval_start_epoch: 2
eval_epoch: 2
