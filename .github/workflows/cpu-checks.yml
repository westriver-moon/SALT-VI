name: CPU checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -c constraints/ci.txt -e ".[test]" build
      - name: Run runtime contracts
        run: |
          python -m pytest src/salt_vi/baselines/vision_text/tests
          python -m pytest src/salt_vi/tests
          PYTHONPATH=. python -m pytest pasd_plugin/tests
      - name: Run semantic-imagination contracts
        if: matrix.python-version != '3.9'
        run: PYTHONPATH=semantic_imagination python -m pytest semantic_imagination/tests
      - name: Check CLI help
        run: python scripts/train.py --help
      - name: Compile Python sources
        run: python -m compileall -q src scripts experiments pasd_plugin semantic_imagination feature_analysis
      - name: Build and inspect wheel resources
        run: |
          python -m build --wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              members = archive.namelist()
          assert any(name.endswith("salt_vi/data/assets/bpe_simple_vocab_16e6.txt.gz") for name in members)
          assert not any("/tests/" in name for name in members)
          assert not any(name.endswith("/tests") for name in members)
          assert any(name.endswith("salt_vi/config/default.yaml") for name in members)
          PY
