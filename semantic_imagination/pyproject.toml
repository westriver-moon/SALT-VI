[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salt-semantic-imagination"
version = "0.3.0"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
regional = [
  "opencv-python-headless==4.10.0.84",
  "timm==0.9.16",
  "ultralytics==8.3.179",
]

[project.scripts]
salt-qri = "semantic_imagination.regional.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["semantic_imagination*"]
