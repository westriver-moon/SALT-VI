[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salt-person-preprocessing"
version = "1.0.0"
description = "Materialize audited V1+YOLO26 person-fit assets"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.1",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
salt-person-preprocess = "person_preprocessing.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["person_preprocessing*"]
