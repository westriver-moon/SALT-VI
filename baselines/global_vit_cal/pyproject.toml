[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salt-vi-global-cal"
version = "0.1.0"
description = "Standalone global CAL baseline implementation for RGB-IR ReID"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.0",
  "PyYAML>=6.0",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
