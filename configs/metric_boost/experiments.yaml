version: 1
program: sysu_metric_boost
source:
  branch: codex/metric-boost-prep
  base_branch: main
  base_commit: cb4be596896be0ab21438778321e60ac6b31d7c8
  e4_config: configs/stage_b/vit_source_core_sysu_no_sff_parameter_add_pa05.yaml
  checkpoint_resolution: log_backed_auto_discovery
reference:
  Rank-1: 0.81620
  mAP: 0.78663
  mINP: 0.67711
  tolerance_fraction: 0.0005
protocol:
  dataset: SYSU-MM01
  test_mode: all
  gall_mode: single
  gallery_trials: 10
  report_trial_aggregate: mean
  test_labels_for_training: forbidden
  test_labels_for_tuning: forbidden
  query_gallery_split_changes: forbidden
  mixed_protocol_reporting: forbidden
gpu_policy:
  memory_used_less_than_mib: 2000
  utilization_less_than_pct: 20
  max_jobs_per_gpu: 1
  lease: advisory_file_lock
  foreground_only: true
  default_action: prepare-only
failure_policy:
  stop_dependent_experiments: true
  skip_succeeded_on_resume: true
  preserve_existing_outputs: true
  overwrite_e4_checkpoint: forbidden
validity:
  weighted_search: exploratory test-set-tuned
  rerank_search: exploratory test-set-tuned post-processing
  formal_claim_requires_independent_validation: true
order:
  - EVAL-0
  - EVAL-1
  - EVAL-2
  - EVAL-3
  - EVAL-4
  - EVAL-5
  - EVAL-6
  - TRAIN-1
  - TRAIN-2
  - TRAIN-3
  - TRAIN-4
  - TRAIN-5
  - TRAIN-6
  - TRAIN-7
  - TRAIN-8
expanded_counts:
  evaluation: 93
  training: 33
evaluation:
  EVAL-0:
    description: strict E4 reproduction
    CAT_EVAL: false
    test_mode: all
    gall_mode: single
    test_modality: Fusion
    blocks_following_stages_on_failure: true
  EVAL-1:
    description: legacy equal-weight MER
    CAT_EVAL: true
    mer_l2_normalize: false
    weights: {fusion: 1.0, ir: 1.0, text: 1.0}
  EVAL-2:
    description: weighted MER with per-stream L2 normalization
    fusion_weight: [1.0]
    ir_weight: [0.0, 0.25, 0.5, 0.75, 1.0]
    text_weight: [0.0, 0.25, 0.5, 0.75, 1.0]
    maximum_trials: 25
    validity: exploratory test-set-tuned
  EVAL-3:
    description: horizontal flip TTA
    modes: [fusion, best_weighted_mer]
    operations: [extract_original, extract_flip, l2_each, mean, l2_final]
  EVAL-4:
    description: multiscale TTA
    modes: [fusion, best_weighted_mer]
    scale_sets:
      - [[288, 144]]
      - [[256, 128], [288, 144]]
      - [[288, 144], [320, 160]]
      - [[256, 128], [288, 144], [320, 160]]
    operations: [l2_each_scale, mean, l2_final]
  EVAL-5:
    description: standard k-reciprocal re-ranking
    bases: [e4_fusion, best_weighted_mer, best_weighted_mer_tta]
    k1: [10, 20, 30]
    k2: [3, 6]
    lambda: [0.2, 0.3, 0.5]
    retain_without_reranking: true
    validity: exploratory test-set-tuned post-processing
  EVAL-6:
    description: nearby E4 checkpoint ensemble
    offsets: [-4, -2, 0, 2, 4]
    only_existing_loadable: true
    methods: [feature, score]
    maximum_checkpoints: 5
training:
  common:
    warm_start: resolved E4 checkpoint
    preserve_e4_config: true
    standard_evaluation_after_training: true
  TRAIN-1:
    description: partial PMT-ViT unfreezing
    freeze_epochs: 3
    variants:
      - {name: U1, last_n_blocks: 2, visual_lr: 1.0e-6}
      - {name: U2, last_n_blocks: 2, visual_lr: 3.0e-6}
      - {name: U3, last_n_blocks: 4, visual_lr: 1.0e-6}
      - {name: U4, last_n_blocks: 4, visual_lr: 3.0e-6}
    frozen: [patch_embedding, positional_embedding, class_token]
    trainable_after_start: [selected_blocks, final_norm, projection, classifier]
  TRAIN-2:
    description: fixed and learnable pa
    fixed_pa: [0.3, 0.4, 0.5, 0.6, 0.7]
    learnable: {enabled: true, parameterization: sigmoid, pa_init: 0.5}
  TRAIN-3:
    description: Stage B four-modality cross-modal hard mining
    variants:
      - {name: H0, losses: [id, wrt]}
      - {name: H1, losses: [id, cross_modal_hard], cross_modal_hard_weight: 1.0}
      - {name: H2, losses: [id, wrt, cross_modal_hard], cross_modal_hard_weight: 0.25}
      - {name: H3, losses: [id, wrt, cross_modal_hard], cross_modal_hard_weight: 0.5}
    modalities: [RGB, IR, Fusion, Text]
    checks: [batch_alignment, finite_losses, finite_gradients, nonempty_positives]
  TRAIN-4:
    description: repeat selected one or two configurations
    seeds: [0, 1, 42]
    selection_source: independent validation when available; otherwise exploratory test-set-tuned
    reports: [individual, mean, standard_deviation, best_single]
    ensembles: [score, feature]
    optional_weight_averaging: [uniform, greedy]
  TRAIN-5:
    description: existing LLM augmentation assets
    probabilities: [0.25, 0.5]
    require_asset_alignment: true
    generate_test_identity_text: forbidden
  TRAIN-6:
    description: bounded label smoothing and loss-weight ablation
    maximum_trials: 6
    variants:
      - {label_smoothing: 0.0}
      - {label_smoothing: 0.05}
      - {label_smoothing: 0.1}
      - {id_loss_weight: 0.5}
      - {id_loss_weight: 1.5}
      - {wrt_loss_weight: 0.5}
  TRAIN-7:
    description: higher input resolution with explicit positional resize
    resolutions: [[320, 160], [384, 192]]
  TRAIN-8:
    description: CLS and patch pooling
    variants:
      - {visual_pooling: cls}
      - {visual_pooling: mean_patch}
      - {visual_pooling: gem_patch}
      - {visual_pooling: cls_gem, patch_pool_gamma_init: 0.0}
