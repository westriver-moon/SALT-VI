experiments:
  - id: FGAP-P1-asym-hard
    hypothesis: Pair-weighted hard mining prioritizing RGB/Fusion geometry improves identity alignment without changing the visual backbone.
    overrides:
      visual_unfreeze_last_n_blocks: 0
      uni_BN: false
  - id: FGAP-P2-asym-hard-u2
    hypothesis: Delayed low-LR adaptation of the last two visual blocks improves the weighted cross-modal identity geometry.
    overrides:
      visual_unfreeze_last_n_blocks: 2
      visual_unfreeze_start_epoch: 3
      visual_lr: 1.0e-6
      uni_BN: false
  - id: FGAP-P3-asym-hard-qbn
    hypothesis: Modality-specific BN statistics reduce feature-distribution mismatch while retaining a shared identity classifier.
    overrides:
      visual_unfreeze_last_n_blocks: 0
      uni_BN: true
