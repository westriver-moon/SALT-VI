version: 1
stage: PAIRWISE-1
description: Pairwise combinations of the three individually positive E4 improvements.
protocol:
  warm_start: E4 epoch-9 checkpoint resolved by the metric-boost runtime
  dataset: SYSU-MM01
  test_mode: all
  gall_mode: single
  gallery_trials: 10
  seed: 0
  max_parallel_jobs: 3
common_overrides:
  mode: train
  dataset: sysu
  test_mode: all
  gall_mode: single
  test_modality: Fusion
  gallery_trials: 10
  CAT_EVAL: false
  test_flip_tta: false
  test_multi_scale: [[288, 144]]
  rerank: false
  ensemble_mode: none
  seed: 0
  test_batch_size: 16
experiments:
  - id: PAIRWISE-1-hard-llm05
    description: cross-modal hard mining plus existing LLM text augmentation
    overrides:
      loss_names: id,cross_modal_hard
      cross_modal_hard_weight: 1.0
      llm_aug: true
      llm_aug_prob: 0.5
      id_loss_weight: 1.0
  - id: PAIRWISE-1-hard-id15
    description: cross-modal hard mining plus ID loss weight 1.5
    overrides:
      loss_names: id,cross_modal_hard
      cross_modal_hard_weight: 1.0
      llm_aug: false
      llm_aug_prob: 0.5
      id_loss_weight: 1.5
  - id: PAIRWISE-1-llm05-id15
    description: existing LLM text augmentation plus ID loss weight 1.5
    overrides:
      loss_names: id,wrt
      cross_modal_hard_weight: 0.0
      llm_aug: true
      llm_aug_prob: 0.5
      id_loss_weight: 1.5
