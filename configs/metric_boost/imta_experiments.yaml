stage: IMTA-1
common_overrides:
  mode: train
  training_mode: RGB_IR_Text
  joint_mode: uni
  fusion_way: parameter_add
  pa: 0.5
  llm_aug: false
  Fix_Visual: true
  total_train_epoch: 33
  eval_start_epoch: 1
  eval_epoch: 2
  test_batch_size: 16
  imta_temperature: 0.07
  imta_relation_temperature: 0.10
experiments:
  - id: IMTA-M1-prototype-retry1
    description: Successful isolated retry of visual ID prototype alignment plus RGB/IR dual-text SupCon; supersedes the CUDA-OOM attempt.
    overrides:
      loss_names: id,wrt,imta_proto,imta_dual
      imta_proto_weight: 0.25
      imta_dual_weight: 0.10
      imta_relation_weight: 0.0
  - id: IMTA-M2-relation
    description: M1 plus visual-to-text neighborhood relation distillation.
    overrides:
      loss_names: id,wrt,imta_proto,imta_dual,imta_rel
      imta_proto_weight: 0.25
      imta_dual_weight: 0.10
      imta_relation_weight: 0.10
  - id: IMTA-M2-relation-light
    description: Low-weight relation variant to test E4 sensitivity.
    overrides:
      loss_names: id,wrt,imta_proto,imta_dual,imta_rel
      imta_proto_weight: 0.15
      imta_dual_weight: 0.05
      imta_relation_weight: 0.05
