experiments:
  - id: FGAP2-P1-h1-qbn
    hypothesis: Equal-weight H1 with modality-specific BN improves modality calibration without asymmetric pair weighting.
    overrides: {}
  - id: FGAP2-P2-h1-qbn-freeze
    hypothesis: Updating QBN statistics for zero-based epochs 0-4 and freezing them from epoch 5 reduces late statistical drift while retaining trainable affine parameters.
    overrides:
      qbn_freeze_running_stats_epoch: 5
