extends: ../sysu_pmt_mbpatch.yaml

# The validated Stage-A architecture is the independent PMT MBPatch model.
# Every SR group keeps this recipe and the global PK=8x4 batch unchanged.
data:
  source_height: 256
  source_width: 128
  sr_root: /home/cgv841/datasets/derived/SYSU-MM01-swinir-x2-pmt256-v1
  sr_modalities: []
  batch_size_per_modality: 32
  num_pos: 4

model:
  gradient_checkpointing: true
  backbone_chunk_size: 8

train:
  max_epoch: 24
  amp: true
  eval_interval: 2
  save_interval: 2

test:
  trials: 10
  training_trials: 10
  batch_size: 8

experiment:
  family: PMT-MBPatch-SYSU-SR-x2
  seed: 0
  selection_rule: highest Rank-1; report mAP and mINP at the same epoch
