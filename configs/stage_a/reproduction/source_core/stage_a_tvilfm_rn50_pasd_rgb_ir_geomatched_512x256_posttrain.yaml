extends: rn50_ori_stage_a_control.yaml

# Full visual post-training from the official TVI-LFM SYSU VI-ReID base model.
output_root: train_outputs/stage_a_tvilfm_rn50_pasd_posttrain/pasd_rgb_ir_geomatched_512x256_1view_v1/
experiment_name: stageA_TVILFM-RN50_PASD-RGB_IR-Geomatched_512x256_PostTrain_seed0
CUDA_VISIBLE_DEVICES: "2"
gpu_id: "0"

training_weight_init: /home/lab929/ybj/SALT-VI/pretrained/tvi_lfm/sysu/VI_sysu_BASE.pth
Fix_Visual: false
freeze_text_in_image_only: true

img_h: 512
img_w: 256
img_size: [512, 256]
sysu_source_size: [256, 128]
sysu_sr_data_root: /home/lab929/datasets/derived/SYSU-MM01-pasd-rgb-ir-geomatched-512x256-1view-v1
sysu_sr_modalities: [rgb, ir]
sysu_sr_backend: pasd_multiview
sysu_sr_view_manifest: /home/lab929/datasets/derived/SYSU-MM01-pasd-rgb-ir-geomatched-512x256-1view-v1/manifest.jsonl
sysu_sr_views_per_image: 1
sysu_sr_view_sampling: paired
sysu_sr_eval_view_index: 0
sysu_sr_exact_size: true

batch_size: 16
num_pos: 4
sampler_type: identity_current_replace
seed: 0

optimizer: Adam
lr_visual: 0.000035
classifier_lr_factor: 1.0
visual_bias_lr_factor: 1.0
visual_weight_decay: 0.0005
visual_weight_decay_bias: 0.0005
alpha: 0.9
beta: 0.999
lrscheduler: cosine
warmup_epochs: 2
warmup_factor: 0.01
target_lr_factor: 0.01
total_train_epoch: 20
eval_start_epoch: 2
eval_epoch: 2
checkpoint_epoch: 2
