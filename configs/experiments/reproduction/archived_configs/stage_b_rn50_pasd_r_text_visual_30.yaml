extends: configs/stage_b/r_text_visual_20260729.yaml

config_select: configs/experiments/reproduction/archived_configs/stage_b_rn50_pasd_r_text_visual_30.yaml
output_root: ${AR2_OUTPUT_DIR}/model_output/
metric_events_path: ${AR2_OUTPUT_DIR}/events.jsonl
metric_experiment_id: SALTVI-STAGEB-RN50-PASD-R-TEXT-VISUAL-30-20260815
CUDA_VISIBLE_DEVICES: "1"
gpu_id: "0"

# Match the retained Stage-A model architecture.
pretrain_choice: RN50_ORI
pretrain_path: default
prj_output_dim: 2048
training_weight_init: /home/lab929/ybj/SALT-VI/checkpoints/stage_a/experiments/stage_a_tvilfm_rn50_pasd_direct_20260813/best/model_IR_epoch_115.pth

# Match the geometry-matched PASD inputs used by Stage-A.
img_h: 512
img_w: 256
img_size: [512, 256]
sysu_source_size: [256, 128]
sysu_sr_data_root: /home/lab929/datasets/derived/SYSU-MM01-pasd-rgb-ir-geomatched-512x256-1view-v1
sysu_sr_modalities: [rgb, ir]
sysu_sr_backend: pasd_multiview
sysu_sr_view_manifest: /home/lab929/datasets/derived/SYSU-MM01-pasd-rgb-ir-geomatched-512x256-1view-v1/manifest.jsonl
sysu_sr_views_per_image: 1
sysu_sr_view_sampling: paired
sysu_sr_eval_view_index: 0
sysu_sr_exact_size: true

# Historical best R_TEXT_VISUAL Stage-B text/fusion/training recipe.
training_mode: RGB_IR_Text
joint_mode: uni
captioner_name: Blip
fusion_way: parameter_add
pa: 0.5
learnable_pa: false
Fix_Visual: true
visual_unfreeze_last_n_blocks: 0
fixed_visual_data_parallel: false
batch_size: 32
num_pos: 4
sampler_type: identity_auto_replace
loss_names: id,cross_modal_hard
id_loss_weight: 1.0
cross_modal_hard_weight: 1.25
cross_modal_pair_weights:
  RGB-IR: 1.0
  RGB-Text: 1.0
  IR-Text: 1.0
  RGB-Fusion: 0.0
  IR-Fusion: 0.0
  Fusion-Text: 0.0
optimizer: AdamW
lr_visual: 0.0003
lr_txt: 7.5e-06
warmup_epochs: 3
warmup_factor: 0.01
warmup_method: linear
lrscheduler: cosine
target_lr_factor: 0.01
total_train_epoch: 30

retrieval_backend: legacy
test_modality: Fusion
test_model_type: Fusion
eval_before_train: true
eval_start_epoch: 1
eval_epoch: 1
gallery_trials: 10
test_mode: all
gall_mode: single
save_best_per_metric: true
max_save_model_num: 1
