extends: configs/experiments/stage_b_rn50_pasd_r_text_visual_30/train.yaml

# Stage B2 alternative: directly constrain every RGB/IR/Text/Fusion pair.
config_select: configs/experiments/stage_b_rn50_two_stage_grid_40/phase2_fullpairs.yaml
metric_experiment_id: STAGEB-RN50-TWO-STAGE-B2-FULLPAIRS
output_root: /tmp/stage_b_rn50_two_stage_grid_40/phase2/model_output/
metric_events_path: /tmp/stage_b_rn50_two_stage_grid_40/phase2/events.jsonl

loss_names: id,cross_modal_hard
id_loss_weight: 1.0
cross_modal_hard_weight: 1.25
cross_modal_pair_weights:
  RGB-IR: 1.0
  RGB-Text: 1.0
  IR-Text: 1.0
  RGB-Fusion: 1.0
  IR-Fusion: 1.0
  Fusion-Text: 1.0

optimizer: AdamW
lr_visual: 0.00005
lr_txt: 0.0000025
warmup_epochs: 1
warmup_factor: 0.01
warmup_method: linear
lrscheduler: cosine
target_lr_factor: 0.01
total_train_epoch: 16

eval_before_train: true
eval_start_epoch: 1
eval_epoch: 1
save_best_per_metric: true
max_save_model_num: 1
